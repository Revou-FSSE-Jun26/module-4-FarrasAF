[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["venv/", "migrations/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
